[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpa-python" # Escolha um nome único no PyPI (GPA já deve existir)
version = "0.1.0"
authors = [
  { name="Rubens Andreas Sautter", email="rubens.sautter@gmail.com" },
]
description = "Gradient Pattern Analysis"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "scipy",
]

# Permite que o usuário instale o suporte a GPU rodando: pip install gpa-python[gpu]
[project.optional-dependencies]
gpu = ["cupy"] 

[tool.setuptools.packages.find]
where = ["src"]